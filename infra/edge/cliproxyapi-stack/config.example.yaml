# Server host/interface to bind to.
# In Docker bridge mode this must not be 127.0.0.1, otherwise host port mapping cannot reach the process.
# Host-side localhost-only exposure is enforced by docker-compose port bindings (127.0.0.1:8317:8317).
host: ""

# Server port
port: 8317

tls:
  enable: false
  cert: ""
  key: ""

remote-management:
  # SSH tunnel to localhost for management access; do not expose management publicly.
  # In Docker bridge mode, tunnel traffic arrives from a bridge source IP rather than 127.0.0.1.
  # Keep this true for containerized deployments; localhost-only exposure is still enforced by
  # docker-compose host bindings (127.0.0.1:8317:8317).
  allow-remote: true
  # Set this before first start if you want the Management API enabled over your SSH tunnel.
  secret-key: ""
  disable-control-panel: false
  panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"

auth-dir: "~/.cli-proxy-api"

api-keys:
  - "replace-me"

debug: false

pprof:
  enable: false
  addr: "127.0.0.1:8316"

# Native provider plugins are persisted by docker-compose under /CLIProxyAPI/plugins.
# Keep this enabled so optional providers can be installed without rebuilding the image.
plugins:
  enabled: true
  dir: "/CLIProxyAPI/plugins"

commercial-mode: false
logging-to-file: true
logs-max-total-size-mb: 512
error-logs-max-files: 10
usage-statistics-enabled: true
redis-usage-queue-retention-seconds: 60
proxy-url: ""
force-model-prefix: false
passthrough-headers: false
request-retry: 3
max-retry-credentials: 0
max-retry-interval: 30
disable-cooling: false
save-cooldown-status: false
transient-error-cooldown-seconds: 0
disable-claude-cloak-mode: false
disable-image-generation: false
video-result-auth-cache-ttl: "3h"
quota-exceeded:
  switch-project: true
  switch-preview-model: true
  antigravity-credits: true
routing:
  strategy: "round-robin"
  session-affinity: true
  session-affinity-ttl: "24h"
codex:
  identity-confuse: false
ws-auth: true
nonstream-keepalive-interval: 0
